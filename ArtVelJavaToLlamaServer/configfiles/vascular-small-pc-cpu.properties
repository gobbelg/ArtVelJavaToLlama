# Settings for a limited Windows PC (i5, 16 GB RAM, no GPU): CPU-only llama.cpp build.
# EDIT THE PATHS. Download a CPU (or AVX2) Windows build of llama.cpp, not the CUDA one.

server.executable = C:\llama\llama-b11514-bin-win-cpu-x64\llama-server.exe
server.model = C:\llama\models\gemma-4-E4B-it-IQ4_NL.gguf
server.host = 127.0.0.1
server.port = 8080
server.n-gpu-layers = 0
# 2 slots x 8192 = 16384 total. Keeps the KV cache small enough for 16 GB RAM.
server.ctx-size = 16384
server.batch-size = 512
server.ubatch-size = 256
server.flash-attn = on
# PHYSICAL cores, not logical (Task Manager > Performance > CPU > Cores). Example: 6.
server.threads = 6
server.cont-batching = true
# No mlock: 16 GB is too tight to pin the model in RAM.
server.extra-args =
# Loading from a slow disk can take a while.
server.startup-timeout-minutes = 30

run.default-parallel = 2
# Documents too long for an 8192-token slot are retried alone with the whole 16384.
run.auto-second-pass = true
run.second-pass-parallel = 1
run.model-name = local-model

corpus.directory = C:\vascular\TestCorpus
corpus.extension = .txt

# CPU generation is slow (a few tokens/second); allow plenty of time per request.
http.request-timeout-minutes = 60
http.connect-timeout-seconds = 30

harness.sweep-values = 1,2
harness.slot-size = 8192
harness.sample-size = 5
harness.warm-up = true

# ---- experiment runs (used when an experiment file is given) ----------------
# Each run gets its own sub-folder here, and runs.csv (one row per run) is kept here.
# Keep this on VA-approved storage: run folders contain report-derived text.
output.base-directory = C:\vascular\Experiments
# Short name that appears in run folder names and runs.csv.
run.machine-name = Small-PC-CPU
# Free text recorded in every run manifest (RAM, GPU, power plan, anything else relevant).
run.hardware-notes = Intel i5 (<model>), 16 GB RAM, no GPU
