# Settings for an Apple Mac Studio (M2 Max, 96 GB unified memory), Metal build of llama.cpp.
# EDIT THE PATHS. Paths use forward slashes; ~ means your home folder.
# Select with:  --config=~/vascular/vascular-mac-studio-m2max.properties
# or export VASCULAR_CONFIG=... before launching Eclipse / java.

server.executable = ~/llama.cpp/build/bin/llama-server
server.model = ~/models/gemma-4-E4B-it-IQ4_NL.gguf
server.host = 127.0.0.1
server.port = 8080
# Offload everything to the Metal GPU (unified memory).
server.n-gpu-layers = 999
# 4 slots x 12288 = 49152 total, same as the Xeon profile. 96 GB leaves room to go larger.
server.ctx-size = 49152
server.batch-size = 2048
server.ubatch-size = 512
server.flash-attn = on
# M2 Max: 8 performance cores. 0 would also be acceptable.
server.threads = 8
server.cont-batching = true
# --load-mode mlock is a Windows-build option in this setup; use --mlock on macOS if wanted.
server.extra-args =
server.startup-timeout-minutes = 15

run.default-parallel = 4
run.auto-second-pass = true
run.second-pass-parallel = 1
run.model-name = local-model

corpus.directory = ~/vascular/TestCorpus
corpus.extension = .txt

http.request-timeout-minutes = 20
http.connect-timeout-seconds = 30

harness.sweep-values = 2,3,4
harness.slot-size = 12288
harness.sample-size = 20
harness.warm-up = true
