# Settings for the VA Xeon Silver 4310 + Nvidia A2 machine (Windows).
# Format: key = value. '#' starts a comment. Backslashes are NOT escapes here,
# so Windows paths can be pasted as-is; forward slashes also work.
# Select with:  -Dvascular.config=<this file>   or  --config=<this file>
#          or:  set VASCULAR_CONFIG=<this file>  or type the path at the prompt.

# ---- llama-server -----------------------------------------------------------
server.executable = P:\ORD_Nguyen_202206062D\Glenn\LlamaAppInstall_261008\llama-b11514-bin-win-cuda-12.4-x64\llama-server.exe
server.model = O:\OMHSP_CONDUIT\NLP\Glenn\LLMs\Models\gemma-4-E4B-it-IQ4_NL\gemma-4-E4B-it-IQ4_NL.gguf
server.host = 127.0.0.1
server.port = 8080
server.n-gpu-layers = 999
# TOTAL context across all slots. Slot size = ctx-size / parallel (49152 / 4 = 12288).
server.ctx-size = 49152
server.batch-size = 2048
server.ubatch-size = 512
server.flash-attn = on
# Physical cores (0 = let llama-server decide).
server.threads = 12
server.cont-batching = true
# Anything else, space separated; quote items containing spaces.
server.extra-args = --load-mode mlock
server.startup-timeout-minutes = 15

# ---- run --------------------------------------------------------------------
run.default-parallel = 4
run.auto-second-pass = true
run.second-pass-parallel = 1
run.model-name = local-model

# ---- corpus -----------------------------------------------------------------
corpus.directory = P:\ORD_Nguyen_202206062D\Glenn\DataAnalysis\LLMs\TestCorpus2
corpus.extension = .txt

# ---- HTTP -------------------------------------------------------------------
http.request-timeout-minutes = 20
http.connect-timeout-seconds = 30

# ---- throughput harness (RUN_THROUGHPUT_SWEEP) -------------------------------
harness.sweep-values = 2,3,4
harness.slot-size = 12288
harness.sample-size = 20
harness.warm-up = true

# ---- experiment runs (used when an experiment file is given) ----------------
# Each run gets its own sub-folder here, and runs.csv (one row per run) is kept here.
# Keep this on VA-approved storage: run folders contain report-derived text.
output.base-directory = P:\ORD_Nguyen_202206062D\Glenn\Experiments
# Short name that appears in run folder names and runs.csv.
run.machine-name = VA-Xeon-A2
# Free text recorded in every run manifest (RAM, GPU, power plan, anything else relevant).
run.hardware-notes = Xeon Silver 4310, 12 cores, Nvidia A2 16 GB, <RAM> GB
