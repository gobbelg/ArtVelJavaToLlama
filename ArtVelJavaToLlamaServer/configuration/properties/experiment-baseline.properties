# Experiment file: a baseline run with the prompt built into the code.
# Select with:  --experiment=<this file>  or  -Dvascular.experiment=<this file>
#          or:  set VASCULAR_EXPERIMENT=<this file>
# Used together with the machine file (--config / VASCULAR_CONFIG). Any key here
# overrides the same key in the machine file. A relative path is resolved
# against the folder that contains THIS file.
# Giving an experiment file turns on experiment mode: no prompts, a new run
# folder under output.base-directory, timing/token columns, raw responses.

# ---- identity (appears in the run folder name and runs.csv) -----------------
experiment.label = baseline
experiment.notes = Built-in prompt, deterministic sampling.
# Defaults to the model file name without .gguf.
experiment.model-label = gemma-4-E4B-it-IQ4_NL
# true = SHA-256 of the model file in the manifest (slow for big models).
experiment.hash-model-file = false

# ---- documents --------------------------------------------------------------
# Either set corpus.directory (here or in the machine file) or a list file
# (one path per line; relative paths resolve against the list file's folder).
# Using the same list on every machine and run guarantees identical documents.
# experiment.document-list = corpus-100.txt

# ---- model / server (override machine file values to test configurations) ---
# server.model = O:\OMHSP_CONDUIT\NLP\Glenn\LLMs\Models\other-model\other-model.gguf
# server.ctx-size = 49152
# run.default-parallel = 4
# server.batch-size = 2048
# server.ubatch-size = 512
# server.flash-attn = on

# ---- prompt -----------------------------------------------------------------
# Leave prompt.file unset to use the prompt built into MainVascular.
# prompt.file = prompt-builtin.txt
# prompt.id = builtin

# ---- sampling ---------------------------------------------------------------
sampling.temperature = 0.0
sampling.top-k = 1
sampling.top-p = 1.0
sampling.repeat-penalty = 1.0
# -1 = not sent. Set a number to make sampled runs repeatable.
sampling.seed = -1

# ---- generation limits ------------------------------------------------------
generation.max-tokens = 6000
generation.retry-max-tokens = 8192
generation.repair-max-tokens = 2048
generation.disable-thinking = true
generation.use-grammar = false

# ---- context budget ---------------------------------------------------------
budget.chars-per-token = 3.0
budget.prompt-overhead-tokens = 128
budget.safety-margin-tokens = 256
